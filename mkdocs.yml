site_name: From Signature to State
site_description: >-
  A developer's guide to blockchains, smart contracts, L2s, security,
  and Rust infrastructure.
site_url: https://vastargazing.github.io/from-signature-to-state/
repo_url: https://github.com/Vastargazing/from-signature-to-state
repo_name: from-signature-to-state
edit_uri: edit/main/docs/
copyright: >-
  © 2026 Vastargazing — text under CC BY 4.0, lab code under MIT.

theme:
  name: material
  language: en
  font:
    text: Google Sans
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# navigation.footer is deliberately absent. Material's Previous/Next follows the
# flat nav order, which is the numeric reference order — not the Core Path. Two
# competing "next chapter" arrows would teach the reader the wrong sequence.

validation:
  anchors: warn
  unrecognized_links: warn
  nav:
    omitted_files: warn
    not_found: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

